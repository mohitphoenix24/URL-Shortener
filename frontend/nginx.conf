# Serves the Vite build as a single-page app: any path that isn't a real
# static file falls back to index.html so client-side routing (and a hard
# refresh on a deep link) doesn't 404 at the web server before React ever
# gets a chance to render. This app doesn't have client-side routes today,
# but every SPA static host needs this fallback the moment it does.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The build's JS/CSS filenames are content-hashed (index-<hash>.js) —
    # safe to cache aggressively since a new build means a new filename,
    # never a stale one served under an old name.
    location ~* \.(?:js|css|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
